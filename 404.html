<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Dev Patel</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    </script>
    <style>
        html.light-mode { --bg-primary: #f5f5f5; --bg-secondary: #ffffff; --text-primary: #1a1a1a; --text-secondary: #555555; --accent: #e05252; --accent-hover: #c94444; --border-color: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --text-primary: #E0E0E0;
            --text-secondary: #B0B0B0;
            --accent: #FF6B6B;
            --accent-hover: #ff5252;
            --border-color: #3a3a3a;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background orbs */
        .bg-animation {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-orb-1 { width: 400px; height: 400px; background: var(--accent); top: 10%; left: 10%; animation-delay: 0s; }
        .bg-orb-2 { width: 300px; height: 300px; background: var(--accent); top: 60%; right: 10%; animation-delay: -7s; }
        .bg-orb-3 { width: 250px; height: 250px; background: var(--accent); bottom: 10%; left: 30%; animation-delay: -14s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%       { transform: translate(30px, -30px) scale(1.1); }
            50%       { transform: translate(-20px, 20px) scale(0.9); }
            75%       { transform: translate(-30px, -20px) scale(1.05); }
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(8rem, 20vw, 14rem);
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -4px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.1s;
        }

        /* Terminal card */
        .terminal-window {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 520px;
            margin: 2rem auto 2.5rem;
            overflow: hidden;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.3s;
        }

        .terminal-header {
            background: rgba(0,0,0,0.3);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .terminal-buttons { display: flex; gap: 6px; }
        .terminal-btn {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .btn-close    { background: #ff5f57; }
        .btn-minimize { background: #febc2e; }
        .btn-maximize { background: #28c840; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .terminal-body {
            padding: 1.25rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.8;
            text-align: left;
        }

        .line-prompt { color: var(--accent); }
        .line-output { color: var(--text-secondary); }
        .line-error  { color: #ff5252; }
        .line-hint   { color: var(--text-primary); }

        .cursor {
            display: inline-block;
            width: 8px; height: 1em;
            background: var(--accent);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* Home button */
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--accent);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            transition: background 0.2s ease, transform 0.2s ease;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.5s;
        }

        .home-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .home-btn svg { flex-shrink: 0; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-orb { animation: none; }
            .error-code, .terminal-window, .home-btn { animation: none; opacity: 1; }
            .cursor { animation: none; }
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <div class="container">
        <div class="error-code">404</div>

        <div class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <div class="terminal-btn btn-close"></div>
                    <div class="terminal-btn btn-minimize"></div>
                    <div class="terminal-btn btn-maximize"></div>
                </div>
                <div class="terminal-title">dev@portfolio:~</div>
            </div>
            <div class="terminal-body">
                <div><span class="line-prompt">$ </span><span class="line-hint">navigate to <span style="color:var(--accent)">this-page</span></span></div>
                <div><span class="line-error">Error: path not found — no such file or directory</span></div>
                <div>&nbsp;</div>
                <div><span class="line-output">The page you're looking for doesn't exist.</span></div>
                <div><span class="line-output">It may have been moved, deleted, or never existed.</span></div>
                <div>&nbsp;</div>
                <div><span class="line-prompt">$ </span><span class="line-hint">cd ~/home </span><span class="cursor"></span></div>
            </div>
        </div>

        <a href="index.html" class="home-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Back to Home
        </a>
    </div>

</body>
</html>
